name: Snapshot Query CLI

on:
  push:
    branches: ["main"]
    paths:
      - "snapshot-query-cli/**"
      - ".github/workflows/snapshot-query-cli.yml"
  pull_request:
    paths:
      - "snapshot-query-cli/**"
      - ".github/workflows/snapshot-query-cli.yml"

permissions: read-all

defaults:
  run:
    working-directory: snapshot-query-cli

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build shadow JAR
        run: ./gradlew shadowJar

      - name: Verify JAR runs
        run: java -jar build/libs/elasticsearch-snapshot-query-cli-*.jar --help
